# Gradle JVM settings.
#
# org.gradle.jvmargs: the default heap is small enough that a Spring context plus
# the Flyway migration parser will thrash. -Xmx2g is the smallest value that
# builds this project without GC pressure; the file encoding is pinned because
# the migrations and tests contain non-ASCII characters in comments and test data.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# Caching is on by default for the build cache, but configuration cache is left
# off: this build is small and the Spring Boot plugin's configuration cache
# support still carries sharp edges around dynamic property resolution.
org.gradle.caching=true
org.gradle.parallel=true

# Without this, a failing compile leaves stale .class files in build/classes that
# the next run can pick up, which is a genuinely confusing way to spend an hour.
org.gradle.warning.mode=summary
